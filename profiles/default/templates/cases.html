<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- TODO(ikken): 2–4 단어 제목 -->
<title>사례 보고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
/* ikken cases — 사례 보고서: 요약 → 분포 표 → 대표 사례 카드(이미지 + 메타) → 정해 주셔야 할 것.
   이미지는 전부 lightbox(휠 확대 · 끌어 이동). 색은 토큰으로만. */
:root{
  --bg:#E6ECEF; --panel:#F7F9FA; --ink:#15212B; --muted:#56676F; --line:#C3CFD6; --grid:#E3EAEE; --code:#EEF2F4;
  --hit:#D23D26; --ok:#0a7d55; --rem:#B57611; --link:#17808A;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,"IBM Plex Sans KR",monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E151B; --panel:#151F28; --ink:#DCE5EB; --muted:#8B9AA5; --line:#293744; --grid:#1A2530; --code:#101921;
  --hit:#FF6B50; --ok:#37c98f; --rem:#E2A843; --link:#4CC0C8;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151B; --panel:#151F28; --ink:#DCE5EB; --muted:#8B9AA5; --line:#293744; --grid:#1A2530; --code:#101921;
  --hit:#FF6B50; --ok:#37c98f; --rem:#E2A843; --link:#4CC0C8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 56px}
header{position:relative;padding-right:48px}
h1{font-size:clamp(1.55rem,3.1vw,2.25rem);line-height:1.2;margin:0 0 .3rem;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{font:.8rem/1.5 var(--mono);color:var(--muted)}
h2{font-size:1.2rem;margin:2rem 0 .6rem}
code,.mono{font-family:var(--mono);font-size:.86em} code{background:var(--code);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
#theme{position:absolute;top:4px;right:0}
.icon{width:34px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin:10px 0}
.ptitle{font-size:.78rem;font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--grid)} .ptitle span{font-weight:400;color:var(--muted);margin-left:6px}
.sum{padding-left:1.3rem;margin:.2rem 0 0} .sum li{margin:.25rem 0} .sum li::marker{font-family:var(--mono);color:var(--muted)}
.tw{overflow-x:auto} table{border-collapse:collapse;font-size:.86rem;min-width:280px}
td,th{padding:5px 10px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap} th{color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.note{font-size:.82rem;color:var(--muted);margin:.4rem 0 0}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
/* 사례 카드 */
.case{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:12px 0}
.case h3{font-size:.95rem;margin:0 0 .2rem}
.chips{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px;margin:.1rem 0 .5rem} .chips b{font-weight:500;color:var(--ink)}
.figs{display:grid;gap:12px;align-items:start} .figs.n1{grid-template-columns:1fr} .figs.n2{grid-template-columns:1fr 1fr} .figs.n3{grid-template-columns:1fr 1fr 1.3fr}
@media (max-width:800px){.figs.n2,.figs.n3{grid-template-columns:1fr}}
figure{margin:0} figure img{width:100%;display:block;border-radius:4px;border:1px solid var(--grid);cursor:zoom-in}
figcaption{font-size:.78rem;color:var(--muted);margin-top:4px}
.dec li{margin:.35rem 0}
/* lightbox — style.md 「lightbox」. 이 블록과 아래 스크립트 블록은 이미지가 있는 모든 페이지에 그대로 복사한다 */
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px}
#lb .cap{color:#fff;font-size:.86rem;max-width:96vw;text-align:center}
#lb .cap code{background:rgba(255,255,255,.14);color:#fff}
#lb .stage{position:relative;overflow:hidden;cursor:zoom-in;touch-action:none}
#lb .stage.zoomed{cursor:grab} #lb .stage.drag{cursor:grabbing}
#lb .stage .zoom{position:absolute}
#lb .stage .zoom img,#lb .stage .zoom svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#lb .zl{font-family:var(--mono);font-variant-numeric:tabular-nums;opacity:.8}
#lb .x{position:absolute;top:12px;right:14px;width:34px;height:30px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:6px;cursor:pointer;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <button id="theme" class="icon" title="테마 (auto → light → dark)" aria-label="테마 전환"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13zM8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0z"/></svg></button>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
</header>

<h2>1. 요약</h2>
<section class="card"><div class="ptitle">요약<span>무엇을 몇 건에서 봤고 무엇이 나왔나</span></div><ol class="sum" id="sum"></ol></section>

<h2>2. 분포</h2>
<div class="tables" id="tables"></div>

<div id="groups"></div>

<h2 id="decH">정해 주셔야 할 것</h2>
<section class="card"><ol class="dec" id="dec"></ol></section>
</div>

<div id="lb" hidden role="dialog" aria-label="이미지 크게 보기"><button class="x" id="lbx" title="닫기 (Esc)" aria-label="닫기">×</button><div class="cap" id="lbcap"></div><div class="stage" id="lbst"></div></div>

<!-- TODO(ikken): <title> 은 2–4 단어로 직접 고친다. 데이터는 python 으로 만들어 넣는다. 이미지는 data URI (JPEG, 긴 변 900–1200px). 크면 data-encoding="gzip-base64".
  {title, sub, summary:[html], tables:[{title, hint, cols:[[이름, 'n'|'']], rows:[[…]], note}],
   groups:[{title, intro, cases:[{title, chips:[[키, 값]], figs:[{src, cap}], note}]}], decisions:[html]} -->
<script type="application/json" id="data">{"title":"예시 — 박스가 비는 사례","sub":"예시 데이터 · 3 cases · 2026-11-04","summary":["<b>12건 / 1,000건 (1.2%)</b> 에서 결과가 비었다.","전부 이미지 위쪽 모서리다."],"tables":[{"title":"위치","hint":"건수","cols":[["위치",""],["건수","n"],["비율","n"]],"rows":[["왼쪽 위",4,"33%"],["오른쪽 위",8,"67%"]],"note":"이미지 위쪽에만 있다."}],"groups":[{"title":"3. 대표 사례","intro":"이미지를 누르면 크게 본다 — 휠 확대 · 끌어 이동.","cases":[{"title":"1. 오른쪽 위","chips":[["scene","demo_a"],["fi","12"]],"figs":[{"src":"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'><rect width='320' height='200' fill='%23789'/><rect x='220' y='10' width='80' height='30' fill='none' stroke='yellow' stroke-width='3'/></svg>","cap":"RAW — 박스"},{"src":"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'><rect width='320' height='200' fill='%23567'/><path d='M200 30 L310 0 L300 40 L190 60Z' fill='none' stroke='yellow' stroke-width='3'/></svg>","cap":"UNDIST — 펴진 4 코너"}],"note":""}]}],"decisions":["<b>None 일 때</b> — (a) 그리지 않음 · (b) 4 코너"]}</script>
<script>
async function loadData(id){
  const el=document.getElementById(id);
  if(el.dataset.encoding==='gzip-base64'){
    const bin=Uint8Array.from(atob(el.textContent.trim()),c=>c.charCodeAt(0));
    const s=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  return JSON.parse(el.textContent);
}
(function(){
  const root=document.documentElement, KEY='ikken-theme', order=[null,'light','dark'];
  let cur=null; try{cur=new URLSearchParams(location.search).get('theme')||localStorage.getItem(KEY)}catch(e){}
  const apply=()=>{cur?root.setAttribute('data-theme',cur):root.removeAttribute('data-theme')}; apply();
  document.getElementById('theme').addEventListener('click',()=>{cur=order[(order.indexOf(cur)+1)%order.length];apply();
    try{cur?localStorage.setItem(KEY,cur):localStorage.removeItem(KEY)}catch(e){}});
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── lightbox: img.lb 를 누르면 화면 전체로. 휠 = 커서 기준 확대 · 축소(×1–×40), 끌기 = 이동,
   두 번 누르기 = 맞춤, ← → = 페이지의 앞 · 뒤 이미지, 바깥 · × · Esc = 닫기.
   SVG 오버레이가 있으면 [stroke-width] 를 배율로 나눠 화면 굵기를 유지한다. ── */
const LB={el:null,list:[],i:-1,s:1,x:0,y:0,w:0,h:0}, ZMAX=40;
function lbList(){LB.list=[...document.querySelectorAll('img.lb,.lbsrc')]}
function lbOpen(el){lbList(); LB.i=LB.list.indexOf(el); $('lb').hidden=false; lbFill(true)}
function lbClose(){LB.i=-1; $('lb').hidden=true; $('lbst').innerHTML=''}
function lbFill(reset){
  if(LB.i<0) return;
  const src=LB.list[LB.i], img=src.tagName==='IMG'?src:src.querySelector('img,svg');
  const nw=img.naturalWidth||img.clientWidth||4, nh=img.naturalHeight||img.clientHeight||3, ar=nw/nh;
  const W=innerWidth*.96, H=innerHeight*.86, w=Math.min(W,H*ar), h=w/ar;
  if(reset||Math.abs(LB.w-w)>.5) Object.assign(LB,{s:1,x:0,y:0,w,h});
  const st=$('lbst'); st.style.width=w+'px'; st.style.height=h+'px';
  const zw=document.createElement('div'); zw.className='zoom'; zw.appendChild(src.cloneNode(true));
  st.innerHTML=''; st.appendChild(zw);
  const cap=src.dataset.cap||(src.closest('figure')?.querySelector('figcaption')?.innerHTML)||'';
  const head=src.closest('.case')?.querySelector('h3')?.innerHTML||'';
  $('lbcap').innerHTML=`${head?head+' · ':''}${cap} · <span class="zl" id="lbzl"></span> — 휠 확대 · 끌어 이동 · 두 번 눌러 맞춤 · ← → 앞뒤 이미지 · 바깥 · × · Esc 닫기 (${LB.i+1}/${LB.list.length})`;
  lbApply();
}
function lbApply(){
  const st=$('lbst'), zw=st.querySelector('.zoom'); if(!zw) return;
  const {w,h}=LB; LB.s=Math.min(ZMAX,Math.max(1,LB.s));
  LB.x=Math.min(0,Math.max(w-w*LB.s,LB.x)); LB.y=Math.min(0,Math.max(h-h*LB.s,LB.y));
  Object.assign(zw.style,{left:LB.x+'px',top:LB.y+'px',width:w*LB.s+'px',height:h*LB.s+'px'});
  zw.querySelectorAll('[stroke-width]').forEach(e=>{
    const o=e.dataset.sw??(e.dataset.sw=e.getAttribute('stroke-width')); e.setAttribute('stroke-width',o/LB.s);
    const d=e.dataset.dash??(e.dataset.dash=e.getAttribute('stroke-dasharray')||'');
    if(d) e.setAttribute('stroke-dasharray',d.split(/[\s,]+/).map(v=>v/LB.s).join(' '));
  });
  const img=zw.querySelector('img');
  if(img) img.style.imageRendering=(img.naturalWidth&&w*LB.s>img.naturalWidth*1.01)?'pixelated':'';
  st.classList.toggle('zoomed',LB.s>1);
  const zl=$('lbzl'); if(zl) zl.textContent=`×${LB.s<10?LB.s.toFixed(1):Math.round(LB.s)}`;
}
$('lb').addEventListener('wheel',e=>{
  if(LB.i<0) return; e.preventDefault();
  const r=$('lbst').getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  const s2=Math.min(ZMAX,Math.max(1,LB.s*Math.exp(-e.deltaY*(e.deltaMode?0.05:0.0015))));
  LB.x=px-(px-LB.x)*s2/LB.s; LB.y=py-(py-LB.y)*s2/LB.s; LB.s=s2; lbApply();
},{passive:false});
let DR=null, DRmoved=false;   // 끌기 시작점 · 끌었는지(끈 뒤의 click 으로 닫히지 않게)
$('lbst').addEventListener('pointerdown',e=>{if(e.button!==0)return; DR={x:e.clientX,y:e.clientY,zx:LB.x,zy:LB.y}; DRmoved=false; $('lbst').setPointerCapture(e.pointerId)});
$('lbst').addEventListener('pointermove',e=>{
  if(!DR) return; const dx=e.clientX-DR.x, dy=e.clientY-DR.y;
  if(Math.hypot(dx,dy)>3){DRmoved=true; $('lbst').classList.add('drag')}
  if(DRmoved&&LB.s>1){LB.x=DR.zx+dx; LB.y=DR.zy+dy; lbApply()}
});
const drEnd=()=>{DR=null; $('lbst').classList.remove('drag')};
$('lbst').addEventListener('pointerup',drEnd); $('lbst').addEventListener('pointercancel',drEnd);
$('lbst').addEventListener('dblclick',()=>{LB.s=1; lbApply()});
$('lb').addEventListener('click',e=>{if(DRmoved){DRmoved=false;return} if(e.target.id==='lb'||e.target.id==='lbx')lbClose()});
window.addEventListener('resize',()=>lbFill(false));
document.addEventListener('keydown',e=>{
  if(LB.i<0) return;
  if(e.key==='Escape') lbClose();
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){LB.i=(LB.i+(e.key==='ArrowRight'?1:LB.list.length-1))%LB.list.length; lbFill(true)}
});
document.addEventListener('click',e=>{const t=e.target.closest('img.lb,.lbsrc'); if(t&&!t.closest('#lb')) lbOpen(t)});
/* ── lightbox 끝 ── */

(async function(){
const D=await loadData('data');
$('title').textContent=D.title; $('sub').textContent=D.sub||'';
$('sum').innerHTML=(D.summary||[]).map(s=>`<li>${s}</li>`).join('');
$('tables').innerHTML=(D.tables||[]).map(t=>`<section class="card"><div class="ptitle">${esc(t.title)}<span>${esc(t.hint||'')}</span></div>
  <div class="tw"><table><tr>${t.cols.map(([c,k])=>`<th class="${k}">${esc(c)}</th>`).join('')}</tr>
  ${t.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${t.cols[i][1]}">${typeof v==='number'?v.toLocaleString():v}</td>`).join('')}</tr>`).join('')}</table></div>
  ${t.note?`<p class="note">${t.note}</p>`:''}</section>`).join('');
$('groups').innerHTML=(D.groups||[]).map(g=>`<h2>${esc(g.title)}</h2>${g.intro?`<p class="note">${g.intro}</p>`:''}
  ${g.cases.map(c=>`<section class="case" data-scene="사례 카드"><h3>${esc(c.title)}</h3>
    <div class="chips">${(c.chips||[]).map(([k,v])=>`<span>${esc(k)} <b>${v}</b></span>`).join('')}</div>
    <div class="figs n${Math.min(3,c.figs.length)}">${c.figs.map(f=>`<figure><img class="lb" src="${f.src}" alt="${esc(f.cap)}" title="누르면 크게 보기 — 휠 확대" loading="lazy"><figcaption>${f.cap}</figcaption></figure>`).join('')}</div>
    ${c.note?`<p class="note">${c.note}</p>`:''}</section>`).join('')}`).join('');
if(!(D.decisions||[]).length){$('decH').hidden=true; $('dec').closest('.card').hidden=true}
$('dec').innerHTML=(D.decisions||[]).map(s=>`<li>${s}</li>`).join('');
})();
</script>
</body>
</html>
